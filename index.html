<!DOCTYPE html>
<html lang="pl" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ewangelie — papierowy teatr</title>
<meta name="description" content="Ewangelie jako przewijany papierowy teatr: każde zdanie ożywa w wycinance.">
<meta name="theme-color" content="#1f3a3c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>window.__errs=[];addEventListener("error",e=>__errs.push(e.message+" @"+(e.filename||"").split("/").pop()+":"+e.lineno));addEventListener("unhandledrejection",e=>__errs.push(String(e.reason)));</script>
</head>
<body>
<div id="scroll-space" aria-hidden="true"></div>

<main class="stage" id="stage" aria-label="Papierowy teatr: ilustracje do czytanego tekstu">
  <div id="scenes"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="loader" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="turn" id="turn" aria-hidden="true">
    <svg class="grain-fill"><rect width="100%" height="100%" fill="url(#grain)"/></svg>
    <p class="turn-title"></p><p class="turn-ref"></p>
  </div>
  <svg class="frame" id="frame" aria-hidden="true" focusable="false"></svg>
</main>

<header class="tag-wrap" id="tag">
  <span class="tag-string" aria-hidden="true"></span>
  <div class="tag">
    <svg class="grain-fill" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grain)"/></svg>
    <button type="button" class="tag-hole" id="home"></button>
    <h2 class="tag-title" id="tag-title"></h2>
    <p class="tag-ref"><span class="parable-mark" data-i18n="parableMark">przypowieść · </span><span id="tag-ref"></span></p>
  </div>
  <button type="button" class="tag-back" id="back" data-i18n="back">Powrót</button>
</header>

<section class="cover" id="cover" aria-label="Strona tytułowa">
  <p class="cover-kicker" id="cover-kicker"></p>
  <nav class="books" id="books"></nav>
  <h1 id="cover-title"></h1>
  <span class="rule" aria-hidden="true"></span>
  <p class="cover-sub"><span class="cover-ch" id="cover-ch"></span><span id="cover-sub"></span></p>
  <nav class="chapters" id="chapters"></nav>
</section>

<section class="caption off" id="caption" aria-live="polite">
  <svg class="grain-fill" aria-hidden="true" focusable="false"><rect width="100%" height="100%" fill="url(#grain)"/></svg>
  <p class="cap-ref" id="cap-ref"></p>
  <p class="cap-text" id="cap-text"></p>
</section>

<nav class="rail" id="rail" aria-label="Części rozdziału"></nav>

<nav class="lang" id="lang" aria-label="Język"></nav>

<p class="hint" id="hint"><span data-i18n="hint">Przewijaj powoli</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m-6-6 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></p>

<section class="end" id="end" aria-label="Koniec rozdziału">
  <p class="end-kicker" id="end-kicker"></p>
  <p class="end-q" id="end-q"></p>
  <div class="end-actions"><button type="button" class="chip" id="again" data-i18n="again">Od początku</button><button type="button" class="chip next" id="next" hidden></button></div>
</section>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs id="defs">
    <pattern id="grain" patternUnits="userSpaceOnUse" width="180" height="180"><image id="grain-img" width="180" height="180"/></pattern>
    <radialGradient id="halo-glow"><stop offset="0" stop-color="#fff1c4" stop-opacity=".9"/><stop offset=".45" stop-color="#ffe7a8" stop-opacity=".35"/><stop offset="1" stop-color="#ffe7a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="warm-glow"><stop offset="0" stop-color="#ffe6a6" stop-opacity=".95"/><stop offset=".4" stop-color="#ffd27a" stop-opacity=".4"/><stop offset="1" stop-color="#ffc766" stop-opacity="0"/></radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#3a2612" flood-opacity=".32"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
</svg>

<script type="module" src="js/main.js"></script>
</body>
</html>
